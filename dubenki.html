<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Природные памятники — копия с новым контентом</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Пример сайта с похожим функционалом: карточки памятников, галерея, модальные окна." />
  <style>
    :root{
      
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #555;
      --accent: #2b6cb0;
      --overlay: rgba(0,0,0,.6);
    }
    *{box-sizing:border-box}
    html, body{margin:0;padding:0;height:100%}
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: url('фон.png');
          background-repeat: repeat-x ;
      color: var(--text);
      line-height: 1.4;
    }
    /* Шапка-герой */
.hero{
  position: relative;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  background: 
              url('шапка2.png') center/cover no-repeat;
}
.hero h1{font-size: 38px; margin:0; padding:0 20px; text-shadow: 0 1px 2px rgba(0,0,0,.4)}
.hero p{margin:8px 0 0; font-size: 16px; opacity:.95}
/* Сетка карточек */
.container{max-width:1100px;margin:40px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{
  background: #f5f7fb00;
  
  border-radius:12px;
  overflow:hidden;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease;
  
}
.card:hover{ transform: translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.08) }
.card img{width:100%; height:150px; object-fit:cover; display:block}
.card .info{padding:12px}
.card .title{font-weight:700; font-size:16px; margin:0 0 6px}
.card .region{color:var(--muted); font-size:14px}
/* Попап-галерея (модальное окно) */
.modal{position: fixed;inset: 0; background: var(--overlay); display:none; align-items:stretch; justify-content:center; padding:20px; z-index: 1000}
.modal.active{ display:flex; }
.modal-content{
  width: min(1000px, 95%);
  height: 84vh;
  background: #fff;
  border-radius: 12px;
  overflow:hidden;
  display:grid;
  grid-template-columns: 1.1fr 0.9fr;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.slides{position:relative; background:#000}
.slides .slide{ position:absolute; inset:0; display:none; }
.slides .slide.active{ display:block; }
.slides img{ width:100%; height:100%; object-fit:cover; }
.nav{ position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%;
       background:#fff; border:1px solid #ccc; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.nav.prev{ left:12px; }
.nav.next{ right:12px; }
.close{ position:absolute; top:8px; right:8px; width:34px;height:34px; border-radius:6px;border:1px solid #ccc;background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.caption{ padding:14px 18px; font-size:15px; line-height:1.4; overflow:auto; }
.section-right{ padding:18px; border-left:1px solid #eee; display:flex; flex-direction:column; gap:12px; }
/* Заголовок внутри модального окна */
.popup-title{ font-size:20px; font-weight:700; margin:0; }
/* кнопка "назад на главную" на витрине (условно) */
.home-link{ color:var(--accent); text-decoration:none; font-weight:600; }
/* Адаптация под мобильные */
@media (max-width: 900px){
  .modal-content{ grid-template-columns: 1fr; height: calc(100vh - 40px); }
  .section-right{ border-left:0; border-top:1px solid #eee; }
  .slides{ height: 50vh; }
  .caption{ height: auto; }
}
</style>
</head>
<body>  <header class="hero" aria-label="Шапка с описанием">
    <div>
      <h1 style="position: center;  ">Дубёнский район</h1>

      <p> <img src = "полоса2.png" style="width: 500px"></p>
      <p><a href="index.html" style="text-decoration: none; position: center; ]">На главную </a> </p>
    </div>
  </header>  <main class="container" aria-label="Секция памятников">
    <section class="grid" id="grid">
      </section>
</main>  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-label="Галерея памятников">
    <div class="modal-content">
      <button class="close" id="modalClose" aria-label="Закрыть">
        ×
      </button>
        <div class="slides" id="slides">
    
  </div>
    <aside class="section-right" id="aside">
    <h3 class="popup-title" id="popupTitle">Название памятника</h3>
    <div id="popupRegion" style="font-weight:700; color:#333;"></div>
    <div class="caption" id="popupDesc" style="color:#555; font-size:14px;">
      Описание памятника будет здесь. Этот блок можно наполнить любым текстом.
    </div>

  </aside>
</div>
</div>  <script>
    // Данные: названия и изображения — взяты из вашего файла
    // Обновлено 5 monuments с точными названиями и текстами
    const items = [
      {
        id: 'osh_pando',
        title: 'Ош пандо - (Сайнинское городище,город на горе)',
        region: 'Дубёнский район, с. Сайнино',
        description: 'Многослойный археологический памятник II тысячелетия до н. э. – I тысячелетия н. э. Внешне представляет собой гору с сохранившимся валом и рвом. Археологические находки, относящиеся к V-VII вв., свидетельствуют о контактах населения сайнинского городища с древней мордвой. Объект культурного наследия народов РФ федерального значения.',
        mainImage: 'ош_гл.jpg',
        gallery: [
          'ош1.jpg',
          'ош2.jpg',
          'ош3.jpg',
          'ош4.png',
          'ош5.jpg'
        ]
      },
      {
        id: 'lisma',
        title: 'Родник «Чай Лисьма»',
        region: 'В черте населенного пункта Дубенки Дубенского района в 20 м от жилых домов',
        description: 'Издавна жители села используют родниковую воду для чая (отчего и назвали так родник), питья и других нужд.В начале 17 века по среднему течению реки Сюксюрма были разбросаны палатки и несколько домов татарской деревушки Нагаево.Мусульмане - увлеченные и стремительные чаепитцы. Чай в селе Ломаты (будущая родина нагаевских татар) пьют каждый день по несколько раз. Вот такой-то родник они нашли на левом берегу Сюксюрмы и с большой нежностью и бережливостью благоустроили его, содержали в идеальной чистоте. А когда через 20 лет они уехали всей деревней служить воеводе Неклюдову (современное село Ломаты), то долгое время приезжали сюда, как они называли - в «Чай колодец», с бочками за свежей водой для чая.Поселившиеся здесь мордва Найманова, установили деревянный столб на верху с бюстом, похожим на женщину - «Ведь ава» и преклонялись ей. Название родника новые переселенцы не изменили, лишь родник переиначили по-мордовски. Отсюда брали, как впрочем, и сейчас, воду для питья, для чая. Здесь построена беседка- домик с неглубоким срубом и лавочками для сиденья.',
        mainImage: 'родник.jpg',
        gallery:  [ 'родник.jpg',]
        
      },
      {
        id: 'kz_cerkov',
        title: 'Казанская церковь ',
        region: 'Дубёнский район, с. Чеберчино ул. Большая д. 21',
        description: 'Горнолыжный комплекс «Тавла» — это современный зимний курорт, расположенный в живописных местах, предлагающий отличные условия для катания на лыжах и сноубордах. Комплекс оснащен несколькими трассами разной сложности, современными подъемниками и оборудованием для обучения новичков. Здесь есть прокат снаряжения, уютные кафе и зоны отдыха. «Тавла» идеально подходит для семейного отдыха, тренировок и активного зимнего развлечения.',

        gallery: [

          'кз3.jpg'
          
        ]

        mainImage: 'краевмузей_гл.jpg',
        gallery: [
          'краевмузей1.jpg',
          'краевмузей2.jpg',

        ]
      },
      {
        id: 'park_bragin',
        title: 'Парк культуры и отдыха имени А. П. Брагина',
        region: 'Дубёнский район, с. Дубёнки, ул. Бровцева',
        description: 'В 2024 году парк открыли после реконструкции, которая прошла в рамках федерального проекта «Формирование комфортной городской среды» нацпроекта «Жильё и городская среда».  Это одно из самых популярных мест для досуга среди жителей Дубенок. Там проводятся все творческие и праздничные мероприятия. В парке открыта аллея Славы, на которой установлены бюсты девяти уроженцам Дубенского района, среди них четыре Героя Советского Союза, один Герой России, два Героя Соцтруда. Этими людьми заслуженно гордятся дубенцы.',
        mainImage: 'парк_гл.jpg',
        gallery: [
          'парк1.jpg',
          'парк2.jpg',
          'парк3.jpg'

        ]
      }
    ];
// Рендер карточек
const grid = document.getElementById('grid');
items.forEach((it) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-id', it.id);
  card.innerHTML = `
    <img src="${it.mainImage}" alt="${it.title}">
    <div class="info">
      <div class="title">${it.title}</div>
      <div class="region">${it.region}</div>
    </div>
  `;
  card.addEventListener('click', () => openModal(it, 0));
  grid.appendChild(card);
});
// Модалка и слайдер
const modal = document.getElementById('modal');
const slidesContainer = document.getElementById('slides');
const popupTitle = document.getElementById('popupTitle');
const popupRegion = document.getElementById('popupRegion');
const popupDesc = document.getElementById('popupDesc');
const modalClose = document.getElementById('modalClose');
const homeLink = document.getElementById('homeLink');
let currentIndex = 0;
let slides = [];
function openModal(item, startIndex) {
  slidesContainer.innerHTML = '';
  slides = item.gallery?.length ? item.gallery : [item.mainImage];
  currentIndex = startIndex;
  slides.forEach((src, i) => {
    const s = document.createElement('div');
    s.className = 'slide' + (i === currentIndex ? ' active' : '');
    s.innerHTML = `<img src="${src}" alt="${item.title} изображение ${i+1}">`;
    slidesContainer.appendChild(s);
  });
  popupTitle.textContent = item.title;
  popupRegion.textContent = item.region;
  popupDesc.textContent = item.description;
  modal.classList.add('active');
  modal.setAttribute('aria-hidden', 'false');
}
function closeModal() {
  modal.classList.remove('active');
  modal.setAttribute('aria-hidden', 'true');
}
function showSlide(index) {
  const sEls = slidesContainer.querySelectorAll('.slide');
  if (!sEls.length) return;
  if (index < 0) index = sEls.length - 1;
  if (index >= sEls.length) index = 0;
  sEls.forEach((el, i) => el.classList.toggle('active', i === index));
  currentIndex = index;
}
// навигация по слайдам
slidesContainer.addEventListener('click', (e) => {
  const w = slidesContainer.clientWidth;
  const x = e.clientX - slidesContainer.getBoundingClientRect().left;
  if (x < w/2) showSlide(currentIndex - 1); else showSlide(currentIndex + 1);
});
// кнопки закрытия
modalClose.addEventListener('click', closeModal);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
  if (e.key === 'ArrowLeft') showSlide(currentIndex - 1);
  if (e.key === 'ArrowRight') showSlide(currentIndex + 1);
});
// ссылка "На главную" (можно заменить реальной URL)
homeLink.addEventListener('click', (e) => {
  e.preventDefault();
  alert('Замените ссылку на главную страницу в вашем проекте.');
});
</script></body>

</html>
